name: Activar nueva versión en el POS

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica publicada (p. ej. 0.6.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-nova
  cancel-in-progress: false

jobs:
  actualizar-aviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validar versión y calcular firma del paquete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG:-}" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="v$MANUAL_VERSION"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag inválido"; exit 1; }
          VERSION="${TAG#v}"
          ASSET="Estacion10-NOVA-${VERSION}.asar"
          mkdir -p .release-check
          gh release download "$TAG" -R "$REPO" --pattern "$ASSET" --dir .release-check --clobber
          test -s ".release-check/$ASSET"
          SIZE=$(stat -c%s ".release-check/$ASSET")
          (( SIZE < 60000000 )) || { echo "El ASAR supera 60 MB"; exit 1; }
          SHA=$(sha256sum ".release-check/$ASSET" | awk '{print $1}')
          NOTES=$(gh release view "$TAG" -R "$REPO" --json body --jq '.body' | head -c 400)
          export TAG VERSION ASSET SHA NOTES REPO
          python3 - <<'PY'
          import os,json
          url="https://github.com/"+os.environ['REPO']+"/releases/download/"+os.environ['TAG']+"/"+os.environ['ASSET']
          with open("latest.json","w",encoding="utf-8") as f:
              json.dump({"version":os.environ["VERSION"],"url":url,"sha256":os.environ["SHA"],"notes":os.environ["NOTES"] or "Mejoras y correcciones de Estación 10"},f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY

      - name: Publicar aviso de actualización
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar actualización: $(python3 -c 'import json; print(json.load(open("latest.json"))["version"])')"
            git push origin HEAD:main
          fi
