name: Publicar manifiesto de actualizaciones

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta publicada (ejemplo: v0.6.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: e10-manifest
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resolver release y verificar archivo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          python3 - <<'PY'
          import json,re,hashlib,os,urllib.request
          release=json.load(open('release.json',encoding='utf-8'))
          tag=release['tag_name']
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag), 'Etiqueta no válida'
          assert not release.get('draft') and not release.get('prerelease'), 'Solo publicar versiones estables'
          name=f'Estacion10-NOVA-{tag}-actualizacion.asar'
          assets=[a for a in release['assets'] if a['name']==name and a.get('state')=='uploaded']
          assert len(assets)==1, 'Falta el archivo .asar esperado'
          asset=assets[0]
          digest=asset.get('digest') or ''
          if re.fullmatch(r'sha256:[0-9a-fA-F]{64}',digest):
              sha=digest.split(':',1)[1].lower()
          else:
              url=asset['browser_download_url']
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Estacion10-NOVA-Release'}),timeout=60) as response:
                  h=hashlib.sha256()
                  while data:=response.read(1024*1024): h.update(data)
                  sha=h.hexdigest()
          notes=(release.get('body') or '').strip()[:400]
          next_manifest={'version':tag[1:],'url':asset['browser_download_url'],'sha256':sha,'notes':notes}
          prev={}
          if os.path.exists('latest.json'):
              prev=json.load(open('latest.json',encoding='utf-8'))
          def vers(v):return tuple(int(x) for x in v.split('.'))
          if prev.get('version') and vers(prev['version'])>vers(next_manifest['version']):
              print('Se ignora una versión más antigua')
          else:
              with open('latest.json','w',encoding='utf-8') as f:
                  json.dump(next_manifest,f,ensure_ascii=False,indent=2);f.write('\n')
              print('Manifiesto:',next_manifest['version'],next_manifest['sha256'])
          PY
          rm -f release.json
      - name: Publicar latest.json
        run: |
          set -euo pipefail
          if git diff --quiet -- latest.json; then echo 'Manifiesto sin cambios'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m "Actualizar manifiesto de Estación 10"
          git push
